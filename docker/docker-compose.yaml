services:
  airflow:
    image: apache/airflow:2.10.2
    command: standalone
    environment:
      PYTHONPATH: /opt/airflow
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
      - ../.env:/opt/airflow/.env:ro
